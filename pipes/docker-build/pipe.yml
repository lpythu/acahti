name: docker-build
inputs:
  images:
    required: true
    description: |
      One image per line. First field is the primary tag. Optional KEY=VAL:
      also extra tags (comma-separated), context (default .), file (Dockerfile),
      anything else is --build-arg (CI passes BASE_IMAGE=<registry>/base/…).
      Job identity is written as BuildKit secrets id=npmrc and id=netrc
      (HTTP Basic from ACAHTI_USER / ACAHTI_TOKEN). Dockerfiles mount
      id=npmrc at /root/.npmrc and id=netrc at /root/.netrc.
      Dockerfiles stay Harbor-free. Default --network=host on buildx.
      CODEUP_NETRC → id=codeup_netrc.
  push:
    required: false
    description: "true (default) is buildx --push; false is --output=type=cacheonly (CI)"
  network:
    required: false
    description: docker buildx --network (default host)
  builder:
    required: false
    description: buildx builder name (default acahti, docker-container + host network)
