name: docker-build
inputs:
  images:
    required: true
    description: |
      One image per line. First field is the primary tag. Optional KEY=VAL:
      also extra tags (comma-separated), context (default .), file (Dockerfile),
      anything else is --build-arg (CI passes BASE_IMAGE=harbor.saidc/base/...).
      Job identity is BuildKit secrets id=acahti_user / id=acahti_token
      (from ACAHTI_USER / ACAHTI_TOKEN). Pipe does not write .npmrc/.netrc.
      Dockerfiles stay Harbor-free. Default --network=host on buildx.
      CODEUP_NETRC → id=codeup_netrc.
  push:
    required: false
    description: "true (default) is buildx --push; false is cache-only (CI, no --load)"
  network:
    required: false
    description: docker buildx --network (default host)
  builder:
    required: false
    description: buildx builder name (default acahti, docker-container + host network)
