name: docker-build
inputs:
  images:
    required: true
    description: |
      One image per line. First field is the primary tag. Optional KEY=VAL:
      also extra tags (comma-separated), context (default .), file (Dockerfile),
      anything else is --build-arg.
  push:
    required: false
    description: "true (default) to push primary and also= tags; false is --load only"
  network:
    required: false
    description: docker buildx --network (default host)
  builder:
    required: false
    description: buildx builder name (default default)
