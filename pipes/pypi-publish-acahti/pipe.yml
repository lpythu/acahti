name: pypi-publish-acahti
inputs:
  path:
    required: false
    description: Directory with pyproject.toml (default .). Builds and PUTs to this Acahti org's PyPI.
  image:
    required: false
    description: Python image (default python:3.12-slim-bookworm). uv is installed if missing. Private registry images need a prior docker-login.
