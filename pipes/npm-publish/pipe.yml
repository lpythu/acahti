name: npm-publish
inputs:
  path:
    required: true
    description: Package directory (contains package.json / dist)
  registry:
    required: true
    description: PUT origin, e.g. https://acahti.example.com/api/packages/acme/npm
  origin:
    required: false
  org:
    required: false
  user:
    required: false
  image:
    required: false
    description: Node image for npm pack (default node:22-alpine). Node is not installed on the Runner.
