name: npm-publish
inputs:
  path:
    required: true
    description: Package directory (package.json). Pipe installs, builds, packs, and PUTs.
  registry:
    required: true
    description: PUT origin, e.g. https://acahti.example.com/api/packages/acme/npm
  origin:
    required: false
  org:
    required: false
  user:
    required: false
  image:
    required: false
    description: Node image (default node:22-alpine). Harbor/ACR images need a prior docker-login, or the Runner Harbor login.
