<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-label="Agents ship. You watch.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1419"/>
      <stop offset="55%" stop-color="#0d171d"/>
      <stop offset="100%" stop-color="#12252c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#87e4c8"/>
    </marker>
  </defs>
  <rect width="1200" height="680" rx="22" fill="url(#bg)"/>
  <circle cx="980" cy="120" r="180" fill="#87e4c8" opacity="0.05"/>
  <circle cx="160" cy="560" r="140" fill="#87e4c8" opacity="0.04"/>
  <g font-family="system-ui, sans-serif">
    <text x="48" y="56" fill="#87e4c8" font-size="13" letter-spacing="3.5">ACAHTI · AGENT DELIVERY</text>
    <text x="48" y="112" fill="#e9f2f5" font-size="42" font-weight="700">Agents ship. You watch.</text>
    <text x="48" y="152" fill="#a4bec9" font-size="18">One identity. Git, CI checks, packages, and MCP — a closed delivery loop.</text>

    <rect x="48" y="210" width="300" height="220" rx="14" fill="#14252e" stroke="#35535e"/>
    <rect x="48" y="228" width="4" height="28" fill="#87e4c8"/>
    <text x="72" y="250" fill="#87e4c8" font-size="22" font-weight="650">CODING AGENT</text>
    <text x="72" y="286" fill="#a4bec9" font-size="15">Install skill · MCP OAuth</text>
    <text x="72" y="314" fill="#a4bec9" font-size="15">push · checks_wait · repair</text>
    <text x="72" y="342" fill="#a4bec9" font-size="15">pr_merge · pkg publish</text>
    <text x="72" y="384" fill="#87e4c8" font-size="14" font-weight="600">Does the work</text>

    <rect x="420" y="190" width="360" height="260" rx="14" fill="#14252e" stroke="#35535e"/>
    <rect x="420" y="208" width="4" height="28" fill="#87e4c8"/>
    <text x="444" y="230" fill="#87e4c8" font-size="22" font-weight="650">ACAHTI</text>
    <text x="444" y="268" fill="#a4bec9" font-size="15">Delivery control plane</text>
    <text x="444" y="296" fill="#a4bec9" font-size="15">Shared Git / npm / PyPI identity</text>
    <text x="444" y="324" fill="#a4bec9" font-size="15">Structured CI feedback for agents</text>
    <text x="444" y="352" fill="#a4bec9" font-size="15">Green pipeline required to merge</text>
    <text x="444" y="400" fill="#87e4c8" font-size="14" font-weight="600">Policy + authenticated ops</text>

    <rect x="850" y="210" width="300" height="220" rx="14" fill="#14252e" stroke="#35535e"/>
    <rect x="850" y="228" width="4" height="28" fill="#a9c8ff"/>
    <text x="874" y="250" fill="#a9c8ff" font-size="22" font-weight="650">YOU</text>
    <text x="874" y="286" fill="#a4bec9" font-size="15">Board · Inbox · approvals</text>
    <text x="874" y="314" fill="#a4bec9" font-size="15">Branch protection · secrets</text>
    <text x="874" y="342" fill="#a4bec9" font-size="15">Watch progress, set policy</text>
    <text x="874" y="384" fill="#a9c8ff" font-size="14" font-weight="600">Does not drive the loop</text>

    <path d="M352 320 L415 320" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <path d="M785 320 L845 320" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <text x="48" y="500" fill="#87e4c8" font-size="18" font-weight="600">Paste one prompt → agent runs the demo loop → you watch Board</text>
    <text x="48" y="540" fill="#a4bec9" font-size="15">Self-hosted · Apache-2.0 · bring your own coding agent · no hosted model lock-in</text>
    <text x="48" y="590" fill="#6f8b97" font-size="14">Not another GitHub clone. A control plane for agent delivery on infrastructure you own.</text>
  </g>
</svg>
