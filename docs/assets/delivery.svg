<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="One connection. A delivery workflow."><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#87e4c8"/></marker></defs><rect width="1200" height="650" rx="22" fill="#0d171d"/><g font-family="system-ui, sans-serif"><text x="48" y="64" fill="#87e4c8" font-size="13" letter-spacing="3">BENCHYARD / COMPOSABLE TOOLS</text><text x="48" y="118" fill="#e9f2f5" font-size="37" font-weight="650">One connection. A delivery workflow.</text><text x="48" y="154" fill="#a4bec9" font-size="17">Acahti gives coding agents structured operations backed by Git and CI engines.</text><rect x="48" y="240" width="280" height="170" rx="12" fill="#14252e" stroke="#35535e"/><rect x="48" y="258" width="4" height="28" fill="#87e4c8"/><text x="72" y="280" fill="#87e4c8" font-size="23" font-weight="600">YOUR AGENT</text><text x="72" y="312" fill="#a4bec9" font-size="16">Individual OAuth identity</text><text x="72" y="337" fill="#a4bec9" font-size="16">Explicit user authorization</text><text x="72" y="362" fill="#a4bec9" font-size="16">MCP tools + current skill</text><rect x="410" y="215" width="365" height="220" rx="12" fill="#14252e" stroke="#35535e"/><rect x="410" y="233" width="4" height="28" fill="#87e4c8"/><text x="434" y="255" fill="#87e4c8" font-size="23" font-weight="600">ACAHTI</text><text x="434" y="287" fill="#a4bec9" font-size="16">Repository and PR operations</text><text x="434" y="312" fill="#a4bec9" font-size="16">Commit checks and failed logs</text><text x="434" y="337" fill="#a4bec9" font-size="16">Inbox and pipeline operations</text><text x="434" y="362" fill="#a4bec9" font-size="16">Git / npm / PyPI identity</text><rect x="865" y="190" width="285" height="115" rx="12" fill="#14252e" stroke="#35535e"/><rect x="865" y="208" width="4" height="28" fill="#a9c8ff"/><text x="889" y="230" fill="#a9c8ff" font-size="23" font-weight="600">FORGEJO</text><text x="889" y="262" fill="#a4bec9" font-size="16">Git, PRs and packages</text><rect x="865" y="330" width="285" height="115" rx="12" fill="#14252e" stroke="#35535e"/><rect x="865" y="348" width="4" height="28" fill="#a9c8ff"/><text x="889" y="370" fill="#a9c8ff" font-size="23" font-weight="600">WOODPECKER</text><text x="889" y="402" fill="#a4bec9" font-size="16">Pipeline execution on Runner</text><path d="M333 325 L405 325" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 270 L860 247" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M780 360 L860 387" stroke="#87e4c8" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="48" y="530" fill="#87e4c8" font-size="19">Push → inspect checks → repair → review → merge / publish</text><text x="48" y="575" fill="#a4bec9" font-size="16">The agent performs repairs. Acahti supplies authenticated actions, policy and results.</text></g></svg>