# Acahti host deploy. Only tags. Runner lives on the acahti machine.
# Checkout via GITHUB_TOKEN, then rsync into /home/saidc/acahti (keeps host .env).
name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: acahti-release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, acahti]
    steps:
      - uses: actions/checkout@v5
      - name: sync host tree and up
        run: |
          set -euo pipefail
          dest=/home/saidc/acahti
          test -f "${dest}/.env" || { echo "missing ${dest}/.env" >&2; exit 1; }
          rsync -a --delete \
            --exclude '.env' \
            --exclude '.git/' \
            --exclude 'web/node_modules/' \
            --exclude 'web/dist/' \
            --exclude 'internal/web/dist/' \
            "${GITHUB_WORKSPACE}/" "${dest}/"
          cd "$dest"
          bash scripts/up.sh
          docker compose --env-file .env --env-file versions.env ps
